<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.05)"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative blobs -->
  <circle cx="150" cy="150" r="200" fill="rgba(255,255,255,0.07)" filter="url(#blur)"/>
  <circle cx="1100" cy="500" r="250" fill="rgba(255,255,255,0.07)" filter="url(#blur)"/>
  <circle cx="900" cy="100" r="180" fill="rgba(255,255,255,0.05)" filter="url(#blur)"/>

  <!-- Center card -->
  <rect x="80" y="80" width="1040" height="470" rx="32" fill="url(#card)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Download icon circle -->
  <circle cx="600" cy="195" r="72" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <!-- Arrow down icon -->
  <line x1="600" y1="160" x2="600" y2="210" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <polyline points="575,193 600,218 625,193" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Base line -->
  <line x1="575" y1="225" x2="625" y2="225" stroke="white" stroke-width="6" stroke-linecap="round"/>

  <!-- Main title -->
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="72" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-1">GramDL</text>

  <!-- Subtitle -->
  <text x="600" y="378" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="rgba(255,255,255,0.85)" text-anchor="middle">Instagram Video Downloader</text>

  <!-- Tag line -->
  <text x="600" y="428" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.65)" text-anchor="middle">Download Reels, Videos &amp; Photos · Free · No Watermark · HD Quality</text>

  <!-- Bottom badges -->
  <rect x="300" y="468" width="180" height="44" rx="22" fill="rgba(255,255,255,0.15)"/>
  <text x="390" y="496" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓ 100% Free</text>

  <rect x="510" y="468" width="180" height="44" rx="22" fill="rgba(255,255,255,0.15)"/>
  <text x="600" y="496" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓ No Login</text>

  <rect x="720" y="468" width="180" height="44" rx="22" fill="rgba(255,255,255,0.15)"/>
  <text x="810" y="496" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓ HD Quality</text>

  <!-- Domain -->
  <text x="600" y="570" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.5)" text-anchor="middle">gramdl.com</text>
</svg>
